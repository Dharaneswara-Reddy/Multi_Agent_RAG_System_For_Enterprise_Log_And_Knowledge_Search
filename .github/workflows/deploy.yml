name: Deploy

# Build the image, push it to ECR, roll the ECS service.
#
# The ordering is the point: this workflow waits for CI to pass before it does
# anything. `workflow_run` rather than a `push` trigger means a commit that
# fails the retrieval or safety gate is never built, let alone deployed — the
# gate is only worth having if it stands between a regression and production.
#
# Authentication is OIDC role assumption. There are no long-lived AWS keys in
# this repository's secrets, because a leaked static key is valid until someone
# notices and a leaked OIDC token is valid for an hour and only for this repo.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy (leave empty to build from HEAD)"
        required: false
        type: string

concurrency:
  # Not cancel-in-progress: interrupting a half-finished ECS rollout leaves the
  # service mid-deploy with two task definition revisions live.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to mint the OIDC token

jobs:
  # Does this repository actually have what the deploy needs?
  #
  # Without this gate the workflow fails on every green CI run, because it is
  # wired for an OIDC deployment that has not been provisioned: no
  # AWS_DEPLOY_ROLE_ARN secret, and none of the vars below. The first AWS step
  # then dies with "Input required and not supplied: aws-region", which reads
  # like a broken workflow rather than an unconfigured one.
  #
  # An unconfigured deploy is not a failure — nothing is wrong with the commit,
  # and marking it red trains everyone to ignore red. So this reports what is
  # missing in the run summary and skips, while a fully configured repository
  # is unaffected and deploys exactly as before.
  preflight:
    # Skip when CI failed. `workflow_run` fires on completion regardless of
    # outcome, so without this a red build would still deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check that the deploy is configured
        id: check
        # Read through env rather than interpolating directly: a secret spliced
        # into a shell command is one unlucky value away from a syntax error,
        # and `-n` on an env var cannot be tricked by its contents.
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$ROLE_ARN" ]        || missing="$missing\n  - secret AWS_DEPLOY_ROLE_ARN"
          [ -n "$ECR_REPOSITORY" ]  || missing="$missing\n  - variable ECR_REPOSITORY"
          [ -n "$ECS_CLUSTER" ]     || missing="$missing\n  - variable ECS_CLUSTER"
          [ -n "$ECS_SERVICE" ]     || missing="$missing\n  - variable ECS_SERVICE"
          [ -n "$ECS_TASK_FAMILY" ] || missing="$missing\n  - variable ECS_TASK_FAMILY"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped — not configured"
              echo
              echo "This repository has no OIDC deployment credentials, so the build"
              echo "and rollout were skipped rather than failed. Missing:"
              echo -e "$missing"
              echo
              echo "AWS_REGION is optional and defaults to us-east-1."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Deploy is not configured; skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Deploy is configured."
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch, not the commit that
          # triggered CI. Without this the image is built from whatever main
          # points at now, which may not be what passed the gate.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          # Defaulted rather than required: an unset AWS_REGION is what failed
          # this workflow with "Input required and not supplied: aws-region",
          # and every resource in infra/demo lives in us-east-1 anyway.
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR tags are immutable, so pushing an existing tag is an error rather
      # than a no-op. Skipping the build also makes a redeploy of an unchanged
      # commit fast, which is what a rollback is.
      - name: Check whether this tag already exists
        id: exists
        run: |
          if aws ecr describe-images \
              --repository-name "${{ vars.ECR_REPOSITORY }}" \
              --image-ids imageTag="${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v3

      # ARM64 to match the Fargate runtime_platform in infra/. Built under
      # emulation on an x86 runner, which is slow — the model download and the
      # index build dominate anyway.
      - name: Build and push
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          push: true
          provenance: false # ECR's manifest handling and provenance attestations disagree
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          build-args: |
            INDEX_MODE=baked
            AIOPS_EXTRAS=cloud
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gate production behind a reviewer. Configure required reviewers on the
    # environment in repository settings — the workflow cannot enforce that
    # itself.
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    env:
      CLUSTER: ${{ vars.ECS_CLUSTER }}
      API_SERVICE: ${{ vars.ECS_SERVICE }}
      API_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      # Both blank when the console is not deployed (Terraform's `enable_ui =
      # false`). Every console step keys off that, so a single-service stack
      # needs no change here.
      UI_SERVICE: ${{ vars.ECS_UI_SERVICE }}
      UI_FAMILY: ${{ vars.ECS_UI_TASK_FAMILY }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

    steps:
      # Same ref as the build job. This job runs `.github/scripts/` now, so
      # taking the default branch would run the tip's helper against an image
      # built from an older commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          # Defaulted rather than required: an unset AWS_REGION is what failed
          # this workflow with "Input required and not supplied: aws-region",
          # and every resource in infra/demo lives in us-east-1 anyway.
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-deploy-${{ github.run_id }}

      # Not to push anything — only to learn the registry hostname, so the
      # account id does not have to be a secret repeated in an image reference.
      - name: Resolve the ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Record what is live now, so a failed rollout has something to name.
      # Both services, because a rollback that restored only the API would
      # leave the console on the revision that just failed.
      - name: Capture the current task definitions
        id: current
        run: |
          live() {
            aws ecs describe-services --cluster "$CLUSTER" --services "$1" \
              --query 'services[0].taskDefinition' --output text
          }
          api=$(live "$API_SERVICE")
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "API currently: $api"
          if [ -n "$UI_SERVICE" ]; then
            ui=$(live "$UI_SERVICE")
            echo "ui=$ui" >> "$GITHUB_OUTPUT"
            echo "console currently: $ui"
          fi

      - name: Render the task definitions
        run: |
          fetch() {
            aws ecs describe-task-definition --task-definition "$1" \
              --query 'taskDefinition' > "$2"
            python3 .github/scripts/strip_task_definition.py "$2"
          }
          fetch "$API_FAMILY" task-definition-api.json
          if [ -n "$UI_FAMILY" ]; then
            fetch "$UI_FAMILY" task-definition-ui.json
          fi

      - name: Point the API at the new image
        id: taskdef-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-api.json
          container-name: api
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # wait-for-service-stability plus the circuit breaker configured in
      # Terraform: ECS rolls back on its own if the new tasks never pass their
      # health check, and this step fails rather than reporting success.
      - name: Deploy the API
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef-api.outputs.task-definition }}
          service: ${{ env.API_SERVICE }}
          cluster: ${{ env.CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 20

      # The console is the same image with a different entrypoint command, and
      # it needs the same rollout. Terraform sets `ignore_changes` on
      # task_definition for both services, so nothing else ever moves it —
      # without these two steps the console serves whatever image
      # `terraform apply` first pinned, indefinitely.
      - name: Point the console at the new image
        id: taskdef-ui
        if: env.UI_SERVICE != ''
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-ui.json
          container-name: ui
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy the console
        if: env.UI_SERVICE != ''
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef-ui.outputs.task-definition }}
          service: ${{ env.UI_SERVICE }}
          cluster: ${{ env.CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 20

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_URL }}/health" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/health did not return 200 after the rollout"
          exit 1

      # Belt and braces. The circuit breaker should have handled a failed
      # rollout already; this covers the case where tasks are healthy but the
      # smoke test is not.
      #
      # `restore` no-ops on an empty service or revision, which covers both a
      # stack without the console and a failure early enough that nothing was
      # captured.
      - name: Roll back
        if: failure()
        run: |
          restore() {
            [ -n "$1" ] && [ -n "$2" ] || return 0
            echo "::warning::rolling $1 back to $2"
            aws ecs update-service --cluster "$CLUSTER" --service "$1" \
              --task-definition "$2" --force-new-deployment >/dev/null
            aws ecs wait services-stable --cluster "$CLUSTER" --services "$1"
          }
          restore "$API_SERVICE" "${{ steps.current.outputs.api }}"
          restore "$UI_SERVICE" "${{ steps.current.outputs.ui }}"
